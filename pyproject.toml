[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-trading-system"
version = "0.1.0"
description = "Quantitative trading system with IBKR integration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # 后续填充你的核心依赖，如 ib_async, pandas 等
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
# 核心解决导包问题：自动将 src 加入 sys.path
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -v"
# 忽略第三方库的弃用警告
filterwarnings = [
    "ignore::DeprecationWarning:eventkit.*:",
]

[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | build
  | dist
  | __pycache__
  | \.eggs
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = [".venv", "venv", ".git", "__pycache__", "data"]
known_first_party = ["common", "data", "trading", "strategy", "risk", "monitor", "database"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]