calendar:
  market: "NYSE"
  timezone: "America/New_York"

  # Cache settings
  cache:
    enabled: true
    ttl_days: 7
    preload_days_ahead: 30

  # Trading sessions
  trading_sessions:
    regular:
      start: "09:30:00"
      end: "16:00:00"
    pre_market:
      enabled: false
      start: "04:00:00"
      end: "09:30:00"
    after_market:
      enabled: false
      start: "16:00:00"
      end: "20:00:00"
