# Market Data Module Configuration

# IBKR Connection
ibkr:
  host: 127.0.0.1
  port: 4002  # TWS: 7497, IB Gateway: 4001
  client_id: 1
  timeout: 15
  read_only: false

# PostgreSQL Database
database:
  host: localhost
  port: 5432
  database: quant_trading
  user: postgres
  password: 000000
  # Connection URL format (alternative)
  url: postgresql://postgres:000000@localhost:5432/quant_trading

# Redis Cache
redis:
  host: localhost
  port: 6379
  password: 000000
  db: 0
  # Connection URL format (alternative)
  url: redis://localhost:6379/0

# Data Configuration
data:
  # Default history duration (days) when start_date not specified
  default_history_days: 180  # 6 months

  # Redis configuration
  redis_max_bars: 100  # Maximum bars to keep in Redis cache
  redis_ttl_seconds: 3600  # TTL for Redis keys (1 hour)

  # PostgreSQL batch configuration
  pg_batch_size: 100  # Batch size for bulk insert
  pg_batch_interval: 10  # Batch interval in seconds
  pg_max_pool_size: 10  # Connection pool size

# Data Validation
validation:
  max_price_change_percent: 0.20  # Maximum price change (20%)
  max_bar_gap_minutes: 5  # Maximum time gap between bars
  min_volume: 0  # Minimum volume
  strict_mode: false  # If true, reject all invalid data; if false, attempt to fix

# Logging
logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: logs/market_data.log
  max_bytes: 10485760  # 10 MB
  backup_count: 5
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'

# Trading Hours (US Eastern Time)
trading_hours:
  pre_market_start: "04:00"
  regular_start: "09:30"
  regular_end: "16:00"
  after_hours_end: "20:00"

# Market Calendar
calendar:
  market: NYSE  # NYSE, NASDAQ, etc.
  cache_days_ahead: 30
  cache_days_back: 365

# Timezone
timezone:
  market: America/New_York
  local: Asia/Shanghai
