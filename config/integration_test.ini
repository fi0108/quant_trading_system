# 集成测试配置

# ============================================
# IBKR连接配置
# ============================================
[ibkr]
# 连接地址
host = 127.0.0.1

# 端口：4002=模拟盘, 7496=真实盘
port = 4002

# 客户端ID（1-32之间）
client_id = 1

# 连接超时（秒）
timeout = 15

# 数据类型：1=实时, 2=冻结, 3=延迟15分钟
data_type = 3

# ============================================
# PostgreSQL配置
# ============================================
[postgres]
host = localhost
port = 5432
database = quant_trading
user = quant_user
password = 000000

# 连接池大小
max_pool_size = 10

# 批量写入配置
batch_size = 100
batch_interval = 10

# ============================================
# Redis配置
# ============================================
[redis]
host = localhost
port = 6379
db = 0
password = 000000

# 最多保留Bar数
max_bars = 100

# 过期时间（秒）
ttl_seconds = 3600

# 键前缀（可选，用于隔离环境）
key_prefix = test:

# ============================================
# 订阅配置
# ============================================
[subscription]
# 订阅的标的列表
symbols = AAPL,TSLA,MSFT,GOOGL,AMZN

# Bar大小（秒）
bar_size = 60

# ============================================
# 验证配置
# ============================================
[validation]
# 最大价格变动（百分比）
max_price_change_percent = 0.20

# 最大时间间隔（分钟）
max_bar_gap_minutes = 5

# 最小成交量
min_volume = 0

# 严格模式
strict_mode = false

# ============================================
# 回填配置
# ============================================
[backfill]
# 启动时回填最近N个交易日
recent_days = 7

# ============================================
# 质量检查配置
# ============================================
[quality]
# 差异阈值（百分比）
difference_threshold = 0.005

# 检查时间（美东时间）
check_time = 16:30

# ============================================
# 日志配置
# ============================================
[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
